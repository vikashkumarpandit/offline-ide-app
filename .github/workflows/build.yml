name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Download Offline Libraries & Setup Capacitor
        run: |
          set -e
          rm -rf www android
          mkdir -p www/libs/pyodide

          # App files (ide-runtime.js, py-worker.js and sw.js are the new Python engine)
          cp index.html ide-runtime.js pdf-course.js lessons-data.js lessons.js ide-extras.js problems.js py-worker.js sw.js www/
          # Make sure index.html loads the new runtime and no longer loads Skulpt
          grep -q 'ide-runtime.js' www/index.html || sed -i 's#</body>#<script src="ide-runtime.js"></script>\n</body>#' www/index.html
          grep -q 'pdf-course.js' www/index.html || sed -i 's#</body>#<script src="pdf-course.js"></script>\n</body>#' www/index.html
          grep -q 'lessons-data.js' www/index.html || sed -i 's#</body>#<script src="lessons-data.js"></script>\n</body>#' www/index.html
          grep -q 'lessons.js' www/index.html || sed -i 's#</body>#<script src="lessons.js"></script>\n</body>#' www/index.html
          grep -q 'ide-extras.js' www/index.html || sed -i 's#</body>#<script src="ide-extras.js"></script>\n</body>#' www/index.html
          grep -q 'problems.js' www/index.html || sed -i 's#</body>#<script src="problems.js"></script>\n</body>#' www/index.html
          sed -i '/libs\/skulpt/d' www/index.html

          # CodeMirror Core & Theme  (-f makes the build fail loudly if a download breaks)
          B=https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13
          curl -fsSL $B/codemirror.min.css -o www/libs/codemirror.min.css
          curl -fsSL $B/theme/dracula.min.css -o www/libs/dracula.min.css
          curl -fsSL $B/codemirror.min.js -o www/libs/codemirror.min.js
          curl -fsSL $B/mode/python/python.min.js -o www/libs/python.min.js

          # CodeMirror Editing & Search Addons
          curl -fsSL $B/addon/edit/closebrackets.min.js -o www/libs/closebrackets.min.js
          curl -fsSL $B/addon/edit/matchbrackets.min.js -o www/libs/matchbrackets.min.js
          curl -fsSL $B/addon/selection/active-line.min.js -o www/libs/active-line.min.js
          curl -fsSL $B/addon/comment/comment.min.js -o www/libs/comment.min.js
          curl -fsSL $B/addon/dialog/dialog.min.css -o www/libs/dialog.min.css
          curl -fsSL $B/addon/dialog/dialog.min.js -o www/libs/dialog.min.js
          curl -fsSL $B/addon/search/searchcursor.min.js -o www/libs/searchcursor.min.js
          curl -fsSL $B/addon/search/search.min.js -o www/libs/search.min.js
          curl -fsSL $B/addon/search/jump-to-line.min.js -o www/libs/jump-to-line.min.js

          npm install

          # Pyodide (real Python in WebAssembly), bundled inside the APK
          P=node_modules/pyodide
          ls $P
          cp $P/pyodide.js $P/pyodide.asm.js $P/pyodide.asm.wasm $P/python_stdlib.zip $P/pyodide-lock.json www/libs/pyodide/
          du -sh www/libs/pyodide

          # PDF.js (shows course.pdf inside the app, offline)
          J=node_modules/pdfjs-dist
          ls $J $J/build
          mkdir -p www/libs/pdfjs
          cp $J/build/pdf.min.js $J/build/pdf.worker.min.js www/libs/pdfjs/
          cp -r $J/standard_fonts $J/cmaps www/libs/pdfjs/
          du -sh www/libs/pdfjs

          # New code editor (CodeMirror 6). If it cannot be built, the classic editor is used and the build still succeeds.
          if npx esbuild cm6-editor.src.js --bundle --minify --format=iife --target=chrome87 --outfile=www/libs/cm6.js; then
            sed -i '0,/<style>/s#<style>#<script src="libs/cm6.js"></script>\n  <style>#' www/index.html
            ls -la www/libs/cm6.js
          else
            echo "::warning::New editor could not be built; the classic editor will be used"
          fi

          npx cap add android
          npx cap sync android

      - name: Patch Android Native Theme for Dark Fullscreen & Cutout Support
        run: |
          cat << 'EOF2' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#1e1e1e</item>
                  <item name="colorPrimaryDark">#1e1e1e</item>
                  <item name="colorAccent">#007acc</item>
                  <item name="android:windowBackground">#1e1e1e</item>
                  <item name="android:colorBackground">#1e1e1e</item>
                  <item name="android:statusBarColor">#1e1e1e</item>
                  <item name="android:navigationBarColor">#1e1e1e</item>
                  <item name="android:windowLayoutInDisplayCutoutMode" tools:targetApi="o_mr1">shortEdges</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowBackground">#1e1e1e</item>
                  <item name="android:statusBarColor">#1e1e1e</item>
                  <item name="android:navigationBarColor">#1e1e1e</item>
                  <item name="android:windowLayoutInDisplayCutoutMode" tools:targetApi="o_mr1">shortEdges</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">#1e1e1e</item>
              </style>
          </resources>
          EOF2

      - name: Full screen (hide status bar and navigation bar, draw under the camera cut-out)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "Patching $F"
          PKG=$(grep -m1 '^package ' "$F")
          cat > "$F" << 'EOF3'
          PACKAGE_LINE

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      w.setAttributes(lp);
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      // Draw edge to edge: without this the system pads the page away from the camera cut-out.
                      // The keyboard must still push the page up, so only the keyboard height is used as bottom padding.
                      WindowCompat.setDecorFitsSystemWindows(w, false);
                      View content = findViewById(android.R.id.content);
                      ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                          Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                          v.setPadding(0, 0, 0, ime.bottom);
                          return insets;
                      });
                  }
                  goFullScreen();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) goFullScreen();
              }

              private void goFullScreen() {
                  Window w = getWindow();
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          EOF3
          sed -i "s#^PACKAGE_LINE#$PKG#" "$F"
          cat "$F"

      - name: App name (CodeNova) and icon
        continue-on-error: true   # a problem with the icon must never stop the build
        run: |
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#\(<string name="app_name">\)[^<]*\(</string>\)#\1CodeNova\2#; s#\(<string name="title_activity_main">\)[^<]*\(</string>\)#\1CodeNova\2#' "$S"
          grep -n 'CodeNova' "$S" || true
          if [ -f codenova-icon.png ] && [ -f codenova-foreground.png ] && [ -f codenova-background.png ]; then
            python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true
            python3 - << 'PY'
          import os
          from PIL import Image, ImageDraw
          res = "android/app/src/main/res"
          icon = Image.open("codenova-icon.png").convert("RGBA")
          fg = Image.open("codenova-foreground.png").convert("RGBA")
          bg = Image.open("codenova-background.png").convert("RGB")
          dens = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          files = {}
          for d, (leg, ad) in dens.items():
              sq = icon.resize((leg, leg), Image.LANCZOS)
              m = Image.new("L", (leg, leg), 0)
              ImageDraw.Draw(m).ellipse((0, 0, leg - 1, leg - 1), fill=255)
              rd = Image.new("RGBA", (leg, leg), (0, 0, 0, 0))
              rd.paste(sq, (0, 0), m)
              files["mipmap-%s/ic_launcher.png" % d] = sq
              files["mipmap-%s/ic_launcher_round.png" % d] = rd
              files["mipmap-%s/ic_launcher_foreground.png" % d] = fg.resize((ad, ad), Image.LANCZOS)
              files["mipmap-%s/ic_launcher_background.png" % d] = bg.resize((ad, ad), Image.LANCZOS)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          # everything above worked: only now touch the project (old icons out, new icons in)
          for p in os.listdir(res):
              if p.startswith("mipmap-"):
                  for f in os.listdir(os.path.join(res, p)):
                      if f.startswith("ic_launcher"):
                          os.remove(os.path.join(res, p, f))
          for rel, im in files.items():
              path = os.path.join(res, rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              im.save(path)
          os.makedirs(os.path.join(res, "mipmap-anydpi-v26"), exist_ok=True)
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(os.path.join(res, "mipmap-anydpi-v26", name), "w").write(xml)
          print("icons written:", len(files))
          PY
          else
            echo "::warning::codenova-*.png not found in the repository root; the default icon is kept"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineIDE-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
